services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-4321}:${PORT:-4321}"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "${PORT:-4321}"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port ${PORT:-4321}
    restart: unless-stopped

volumes:
  web_node_modules:
